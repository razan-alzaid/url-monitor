services:
  api:
    build: ./api
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongo
    restart: always

  worker:
    build: ./worker
    env_file:
      - .env
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo
    ports:
      - "27018:27017"
    restart: always